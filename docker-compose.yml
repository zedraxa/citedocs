version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: citedocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: citedocs
      POSTGRES_USER: citedocs
      POSTGRES_PASSWORD: citedocs_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citedocs"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: citedocs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: citedocs_minio
      MINIO_ROOT_PASSWORD: citedocs_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  translation-server:
    image: zotero/translation-server:latest
    container_name: citedocs-translation-server
    restart: unless-stopped
    ports:
      - "1969:1969"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: citedocs-server
    restart: unless-stopped
    environment:
      PORT: 3000
      COLLAB_PORT: 1234
      DATABASE_URL: postgres://citedocs:citedocs_secret_password@postgres:5432/citedocs
      TRANSLATION_SERVER_URL: http://translation-server:1969
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: citedocs_minio
      S3_SECRET_KEY: citedocs_minio_password
      S3_BUCKET: citedocs-attachments
    ports:
      - "3000:3000"
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy
      translation-server:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: citedocs-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
  minio_data:
