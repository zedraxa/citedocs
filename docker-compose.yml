version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: citedocs
      POSTGRES_USER: citedocs
      POSTGRES_PASSWORD: citedocs_secret_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citedocs"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: citedocs_minio
      MINIO_ROOT_PASSWORD: citedocs_minio_password
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  translation-server:
    image: zotero/translation-server:latest
    restart: unless-stopped
    ports:
      - "${TRANSLATION_SERVER_PORT:-1969}:1969"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      COLLAB_PORT: 1234
      DATABASE_URL: postgres://citedocs:citedocs_secret_password@postgres:5432/citedocs
      TRANSLATION_SERVER_URL: http://translation-server:1969
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: citedocs_minio
      S3_SECRET_KEY: citedocs_minio_password
      S3_BUCKET: citedocs-attachments
      COLLABORA_URL: http://collabora:9980
      COLLABORA_PUBLIC_URL: http://localhost:${COLLABORA_PORT:-9982}
      WOPI_SERVER_URL: http://server:3000
    ports:
      - "${SERVER_PORT:-3000}:3000"
      - "${COLLAB_PORT:-1234}:1234"
    depends_on:
      postgres:
        condition: service_healthy
      translation-server:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - server

  collabora:
    image: collabora/code:latest
    restart: unless-stopped
    environment:
      aliasgroup1: "http://server:3000,http://localhost:3000,http://127.0.0.1:3000"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=false --o:net.frame_ancestors=*"
      DONT_GEN_SSL_CERT: "true"
    ports:
      - "${COLLABORA_PORT:-9982}:9980"
    volumes:
      - ./apps/collabora-scripts:/opt/collaboraoffice/share/Scripts/python:ro
    depends_on:
      - server

volumes:
  postgres_data:
  minio_data:
